REQUIRED SYNTAX TO FUNCTION:
===============================================================================

<!DOCTYPE html>                         <!-- Declare Filetype | used by the browser -->
<html lang="en">      </html>                     <!-- Declare at SOF and at EOF for all html contents -->
<head>      </head>                     <!-- Technical metadata for the BROWSER -->
    <!-- Elements in head: -->

        <title>     </title>            <!-- Page title -->
        <meta charset="utf-8">                                                    <!-- Typeset-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">    <!-- Proper scaling -->
        <meta name="description" content=" USER_TEXT ">                           <!-- Description for search engines -->
    <!--                   -->

<body>      </body>                     <!-- Visable content for the end-user -->
    <!-- Elements in body: -->

    <header>        </header>           <!-- Page introduction | often used for logo, site name, searchbar, etc -->

    <!--                   -->
